<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrieren – KarmaKiosk</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wood-bg">
    <header class="site-header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-moon">🌙</span>
                <div>
                    <h1>KarmaKiosk</h1>
                    <p class="tagline">Digitale Downloads für deine spirituelle Reise</p>
                </div>
            </div>
            <nav class="user-nav">
                <a class="btn btn-small" href="index.html">← Zum Shop</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="auth-card card">
            <h2>🌙 Registrieren</h2>
            <p class="flash flash-error" id="register-error" style="display:none"></p>
            <form id="register-form">
                <label for="username">Benutzername</label>
                <input type="text" id="username" required autofocus>
                <label for="email">E-Mail</label>
                <input type="email" id="email" required>
                <label for="password">Passwort (min. 6 Zeichen)</label>
                <input type="password" id="password" minlength="6" required>
                <button type="submit" class="btn">Konto erstellen</button>
            </form>
            <p class="auth-hint">Schon dabei? <a href="login.html">Hier anmelden</a></p>
        </section>
    </main>
</div>
<script src="js/shop.js"></script>
<script src="js/auth.js"></script>
</body>
</html>

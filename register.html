<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrieren – KarmaKiosk</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wood-bg">
    <header class="site-header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-moon">🌙</span>
                <div>
                    <h1><a class="logo-link" href="index.html">KarmaKiosk</a></h1>
                    <p class="tagline">Digitale Downloads für deine spirituelle Reise</p>
                </div>
            </div>
            <nav class="user-nav">
                <a class="btn btn-small" href="warenkorb.html">🧺 Warenkorb (<span class="cart-count">0</span>)</a>
                <a class="btn btn-small" href="index.html">← Zum Shop</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="auth-card card">
            <h2>🌙 Registrieren</h2>
            <p class="flash flash-error" id="register-error" style="display:none"></p>
            <form id="register-form">
                <label for="username">Benutzername</label>
                <input type="text" id="username" required autofocus>
                <label for="email">E-Mail</label>
                <input type="email" id="email" required>
                <label for="password">Passwort</label>
                <input type="password" id="password" required>
                <p class="auth-hint">Min. 12 Zeichen, mind. 1 Großbuchstabe und mind. 1 Sonderzeichen</p>
                <button type="submit" class="btn">Konto erstellen</button>
            </form>
            <p class="auth-hint">Schon dabei? <a href="login.html">Hier anmelden</a></p>
        </section>
    </main>

    <footer class="site-footer">
        <p>🌙 KarmaKiosk · <a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a> · <a href="agb.html">AGB</a> · <a href="cookies.html">Cookies</a></p>
    </footer>
</div>
<script src="js/shop.js"></script>
<script src="js/auth.js"></script>
<script src="js/cookies.js"></script>
</body>
</html>

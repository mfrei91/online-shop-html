<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Bereich – KarmaKiosk</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wood-bg">
    <header class="karmakiosk-header">
        <a href="index.html">
            <picture>
                <source
                    srcset="images/karmakiosk-header.webp"
                    type="image/webp">

                <img
                    src="images/karmakiosk-header.png"
                    alt="KarmaKiosk – Digitale Downloads"
                    width="641"
                    height="175">
            </picture>
        </a>
    </header>
    <nav class="user-nav">
                <a class="btn btn-small" href="warenkorb.html">🧺 Warenkorb (<span class="cart-count">0</span>)</a>
                <a class="btn btn-small" href="index.html">← Zum Shop</a>
                <button class="btn btn-small btn-outline" id="nav-logout" onclick="Shop.logout()">Abmelden</button>
            </nav>
        </div>
    </header>

    <main>
        <section class="section">
            <h2>⚙️ Admin-Bereich</h2>
            <p class="flash flash-error" id="no-access" style="display:none">
                ⚠️ Dieser Bereich ist nur für Administratoren. Bitte melde dich als Admin an.
            </p>

            <div id="admin-content">
                <nav class="tabs">
                    <a href="#" class="tab active" id="tab-offers" data-tab="offers">Angebote</a>
                    <a href="#" class="tab" id="tab-users" data-tab="users">Benutzer</a>
                </nav>

                <div id="panel-offers">
                    <div class="admin-actions">
                        <button class="btn" id="btn-new-offer">＋ Neues Angebot</button>
                    </div>

                    <div class="card form-card" id="offer-form-card" style="display:none">
                        <h3 id="offer-form-title">Neues Angebot</h3>
                        <form id="offer-form">
                            <input type="hidden" id="offer-id">
                            <label for="offer-title">Titel *</label>
                            <input type="text" id="offer-title" required>
                            <label for="offer-description">Beschreibung</label>
                            <textarea id="offer-description" rows="4"></textarea>
                            <div class="form-row">
                                <div>
                                    <label for="offer-price">Preis (€)</label>
                                    <input type="text" id="offer-price" placeholder="9,99">
                                </div>
                                <div>
                                    <label for="offer-category">Kategorie</label>
                                    <select id="offer-category">
                                        <option>Kartenlegungen</option>
                                        <option>Zauber</option>
                                        <option>Rituale</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="offer-emoji">Symbol (Emoji)</label>
                                    <input type="text" id="offer-emoji" maxlength="4" value="🔮">
                                </div>
                                <div>
                                    <label for="offer-discount">Rabatt (%)</label>
                                    <input type="number" id="offer-discount" min="0" max="100" step="1" value="0">
                                </div>
                            </div>
                            <div class="form-checks">
                                <label class="check"><input type="checkbox" id="offer-popular"> Als „beliebt“ markieren</label>
                                <label class="check"><input type="checkbox" id="offer-active" checked> Im Shop sichtbar</label>
                            </div>
                            <label for="offer-image">Bild (optional)</label>
                            <input type="file" id="offer-image" accept="image/*">
                            <div class="image-preview" id="image-preview" style="display:none">
                                <img id="image-preview-img" alt="Vorschau">
                                <button type="button" class="btn btn-small btn-danger" id="image-remove">Bild entfernen</button>
                            </div>
                            <div class="form-actions" id="offer-form-actions">
                                <button type="submit" class="btn">Speichern</button>
                                <button type="button" class="btn btn-outline" id="offer-cancel">Abbrechen</button>
                                <button type="button" class="btn btn-danger" id="offer-delete" style="display:none">Entfernen</button>
                            </div>
                        </form>
                    </div>

                    <div class="admin-table-wrap card">
                        <table class="admin-table">
                            <thead>
                                <tr><th>Titel</th><th>Kategorie</th><th>Preis</th><th>Status</th><th>Aktionen</th></tr>
                            </thead>
                            <tbody id="offers-tbody"></tbody>
                        </table>
                    </div>
                </div>

                <div id="panel-users" style="display:none">
                    <div class="admin-table-wrap card">
                        <table class="admin-table">
                            <thead>
                                <tr><th>Benutzername</th><th>E-Mail</th><th>Rolle</th><th>Aktionen</th></tr>
                            </thead>
                            <tbody id="users-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>🌙 KarmaKiosk · <a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a> · <a href="agb.html">AGB</a> · <a href="cookies.html">Cookies</a></p>
    </footer>
</div>
<script src="js/shop.js"></script>
<script src="js/admin.js"></script>
<script src="js/cookies.js"></script>
</body>
</html>

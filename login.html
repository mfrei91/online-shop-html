<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden – KarmaKiosk</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wood-bg">
    <header class="site-header">
        <div class="header-inner">
            <div class="logo">
                <a class="logo-link" href="index.html">
                    <img class="header-image" src="img/karmakiosk-header.png" alt="KarmaKiosk – Digitale Downloads für deine spirituelle Reise">
                </a>
            </div>
            <nav class="user-nav">
                <a class="btn btn-small" href="warenkorb.html">🧺 Warenkorb (<span class="cart-count">0</span>)</a>
                <a class="btn btn-small" href="index.html">← Zum Shop</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="auth-card card">
            <h2>🔐 Anmelden</h2>
            <p class="flash flash-error" id="login-error" style="display:none"></p>
            <form id="login-form">
                <label for="username">Benutzername</label>
                <input type="text" id="username" required autofocus>
                <label for="password">Passwort</label>
                <input type="password" id="password" required>
                <button type="submit" class="btn">Anmelden</button>
            </form>
            <p class="auth-hint">Noch kein Konto? <a href="register.html">Jetzt registrieren</a></p>
        </section>
    </main>

    <footer class="site-footer">
        <p>🌙 KarmaKiosk · <a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a> · <a href="agb.html">AGB</a> · <a href="cookies.html">Cookies</a></p>
    </footer>
</div>
<script src="js/shop.js"></script>
<script src="js/auth.js"></script>
<script src="js/cookies.js"></script>
</body>
</html>
